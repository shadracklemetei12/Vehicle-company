<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Vehicle - Savannah Motors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="logo.png" width="200" height="200" alt="Savannah Motors Logo">
        <h1>Savannah Motors <br>Kenya</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="inventory.html">Inventory</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <section class="purchase-form">
    <h2>Vehicle Purchase Request Form</h2>

    <form>

        <!-- Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" placeholder="Enter your full name" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="+254 7XX XXX XXX" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="idnum">ID / Passport Number</label>
            <input type="text" id="idnum" placeholder="Enter ID number" required>
        </fieldset>

        <!-- Vehicle Selection -->
        <fieldset>
            <legend>Vehicle Selection</legend>

            <label for="vehicle">Select Vehicle</label>
            <select id="vehicle" required>
                <option value="">-- Choose Vehicle --</option>
                <option>Toyota Corolla Axio</option>
                <option>Honda Vezel</option>
                <option>Subaru Forester</option>
                <option>Mazda CX-5</option>
            </select>

            <label for="year">Preferred Year</label>
            <input type="number" id="year" min="2005" max="2026">

            <label for="color">Color Preference</label>
            <input type="text" id="color" placeholder="e.g Black, White, Silver">

            <label for="transmission">Transmission</label>
            <select id="transmission">
                <option>Automatic</option>
                <option>Manual</option>
            </select>
        </fieldset>

        <!-- Custom Specifications -->
        <fieldset>
            <legend>Additional Specifications</legend>

            <label for="fuel">Fuel Type</label>
            <select id="fuel">
                <option>Petrol</option>
                <option>Diesel</option>
                <option>Hybrid</option>
                <option>Electric</option>
            </select>

            <label for="budget">Budget Range (KSh)</label>
            <input type="number" id="budget" placeholder="Enter your budget">

            <label for="notes">Additional Notes</label>
            <textarea id="notes" rows="4" placeholder="Any extra features? Sunroof, leather seats etc."></textarea>
        </fieldset>

        <!-- Payment Details -->
        <fieldset>
            <legend>Payment Method</legend>

            <label>
                <input type="radio" name="payment"> Cash
            </label>

            <label>
                <input type="radio" name="payment"> Bank Financing
            </label>

            <label>
                <input type="radio" name="payment"> Hire Purchase
            </label>
        </fieldset>

        <!-- Delivery Details -->
        <fieldset>
            <legend>Delivery Details</legend>

            <label>Delivery Location</label>
            <input type="text" placeholder="Town / County">

            <label>
                <input type="checkbox"> I would like home delivery
            </label>
        </fieldset>

        <!-- Agreement -->
        <div class="agreement">
            <label>
                <input type="checkbox" required>
                I confirm that the above information is accurate.
            </label>
        </div>

        <button type="submit">Submit Request</button>

    </form>
</section>
    </main>
    <footer>
        <p>&copy; 2026 Savannah Motors Kenya. All Rights Reserved.</p>
    </footer>
</body>
</html>
